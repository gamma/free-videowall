name: Check and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:website
      - run: npm run test:tizen
      - run: python3 scripts/test_verify_tizen_release.py
      - run: python3 scripts/build.py
      - run: python3 scripts/verify_website.py
      - uses: actions/upload-artifact@v4
        with:
          name: free-videowall
          path: dist/free-videowall.zip
