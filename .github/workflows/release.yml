name: Release preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.0.7'
        required: true
        type: string
      publish:
        description: 'Create a public GitHub prerelease after checks pass'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The workflow may be dispatched against a tag predating this workflow.
      # Keep release validation in the workflow revision, source in the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:website
      - run: python3 scripts/build.py
      - run: python3 scripts/verify_website.py
      - name: Test and build Samsung preview
        if: hashFiles('platforms/tizen/config.xml') != ''
        run: |
          npm run test:tizen
          python3 release-tools/scripts/test_verify_tizen_release.py
          npm run build:tizen-image
          # Linux runners do not remap bind-mount ownership like Docker Desktop.
          # Use root only in this disposable build container, with no signing volume.
          docker run --rm --platform linux/amd64 --user root \
            --mount "type=bind,source=$PWD,target=/workspace" \
            free-videowall/tizen-sdk:10.0 bash -ec \
            'python3 scripts/build_tizen.py; tizen build-web -- dist/tizen; python3 scripts/package_tizen_unsigned.py'
          python3 release-tools/scripts/verify_tizen_release.py --root .
      - name: Bundle Store listing assets
        run: python3 -c "import shutil; shutil.make_archive('dist/store-assets', 'zip', 'docs/store-assets')"
      - name: Validate public release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 release-tools/scripts/verify_release.py --root . --tag "$RELEASE_TAG"
          cd dist
          packages=(free-videowall.zip store-assets.zip)
          if [ -f free-videowall-tizen-unsigned.wgt ]; then
            packages+=(free-videowall-tizen-unsigned.wgt)
          fi
          sha256sum "${packages[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          path: |
            dist/free-videowall.zip
            dist/SHA256SUMS
            dist/store-assets.zip
            dist/free-videowall-tizen-unsigned.wgt
      - name: Publish GitHub preview
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its files.'
            exit 0
          fi
          assets=(dist/free-videowall.zip dist/store-assets.zip dist/SHA256SUMS)
          notes='Development preview / Entwicklungsversion. Roku ZIP requires developer mode; not a Store release. EN/DE setup and playlist instructions are in the README. No user media included. Website: https://videowall.gh.gammaproduction.de/ . Store text and public artwork are in store-assets.zip.'
          if [ -f dist/free-videowall-tizen-unsigned.wgt ]; then
            assets+=(dist/free-videowall-tizen-unsigned.wgt)
            notes+=$'\n\nSamsung: free-videowall-tizen-unsigned.wgt is UNSIGNED and cannot be installed directly. Sign it with your own Samsung certificates for your target TV; see docs/tizen.md in this tag. Tizen uses its own version from config.xml. No Samsung Store approval is implied. / Samsung-WGT ist unsigniert und muss vor der Installation fuer den Ziel-TV signiert werden.'
          fi
          printf '%s\n' "$notes" > /tmp/free-videowall-release-notes.md
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --prerelease --title "Free Videowall $RELEASE_TAG" \
            --notes-file /tmp/free-videowall-release-notes.md

  website:
    needs: release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_website.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
