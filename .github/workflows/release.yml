name: Release preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.0.7'
        required: true
        type: string
      publish:
        description: 'Create a public GitHub prerelease after checks pass'
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The workflow may be dispatched against a tag predating this workflow.
      # Keep release validation in the workflow revision, source in the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:website
      # Older tags can still be checked with workflow_dispatch; they have no LG source.
      - name: Test LG Homebrew player and packager
        if: hashFiles('platforms/webos/app/appinfo.json') != ''
        run: |
          npm run test:webos
          python3 -m unittest discover -s tests -p 'test_build_webos.py'
      - name: Build LG Homebrew IPK with the tag version
        if: hashFiles('platforms/webos/app/appinfo.json') != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/build_webos.py --version "${RELEASE_TAG#v}"
      - run: python3 scripts/build.py
      - run: python3 scripts/verify_website.py
      - name: Bundle Store listing assets
        run: python3 -c "import shutil; shutil.make_archive('dist/store-assets', 'zip', 'docs/store-assets')"
      - name: Validate public release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 release-tools/scripts/verify_release.py --root . --tag "$RELEASE_TAG"
          cd dist
          assets=(free-videowall.zip store-assets.zip)
          if compgen -G '*.ipk' >/dev/null; then assets+=(*.ipk); fi
          sha256sum "${assets[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag || github.ref_name }}
          path: |
            dist/free-videowall.zip
            dist/SHA256SUMS
            dist/store-assets.zip
            dist/*.ipk
      - name: Publish GitHub preview
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its files.'
            exit 0
          fi
          assets=(dist/free-videowall.zip dist/store-assets.zip dist/SHA256SUMS)
          notes='Development preview / Entwicklungsversion. Roku ZIP requires developer mode; not a Roku Store release.'
          if compgen -G 'dist/*.ipk' >/dev/null; then
            assets+=(dist/*.ipk)
            notes+=' LG Homebrew IPK requires a rooted webOS TV, Homebrew Channel and USB service elevation; not an LG Content Store release. See docs/webos.md in the tagged source for installation.'
          fi
          notes+=' No user media included. Website: https://videowall.gh.gammaproduction.de/ . Store text and public artwork are in store-assets.zip.'
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --prerelease --title "Free Videowall $RELEASE_TAG" \
            --notes "$notes"

  website:
    needs: release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_website.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
